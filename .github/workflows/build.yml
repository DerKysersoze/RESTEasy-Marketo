name: Build & Release

on:
  workflow_dispatch:          # manual: "Run workflow" button on GitHub
  push:
    tags:
      - "v*"                  # tagging v0.2.0 etc. builds + publishes a release

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        shell: pwsh
        run: pyinstaller RESTEasy-Marketo.spec --noconfirm
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/RESTEasy-Marketo.exe -DestinationPath RESTEasy-Marketo-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RESTEasy-Marketo-windows-x64
          path: RESTEasy-Marketo-windows-x64.zip

  build-macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest     # arm64 runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller RESTEasy-Marketo.spec --noconfirm
      - name: Show dist/ contents
        run: ls -la dist/
      - name: Ad-hoc code sign (no Developer ID required)
        run: |
          if [ ! -d "dist/RESTEasy-Marketo.app" ]; then
            echo "Expected 'dist/RESTEasy-Marketo.app' — actual contents of dist/:" >&2
            ls -laR dist/ >&2
            exit 1
          fi
          codesign --force --deep --sign - "dist/RESTEasy-Marketo.app"
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent "dist/RESTEasy-Marketo.app" RESTEasy-Marketo-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RESTEasy-Marketo-macos-arm64
          path: RESTEasy-Marketo-macos-arm64.zip

  release:
    name: Publish release
    needs: [test, build-windows, build-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            RESTEasy-Marketo-windows-x64.zip
            RESTEasy-Marketo-macos-arm64.zip
