name: Build & Release

on:
  workflow_dispatch:          # manual: "Run workflow" button on GitHub
  push:
    tags:
      - "v*"                  # tagging v0.2.0 etc. builds + publishes a release
      - "V*"                  # GitHub tag filters are case-sensitive; accept V-prefixed tags too

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        shell: pwsh
        run: pyinstaller RESTEasy-Marketo.spec --noconfirm
      - name: Sign (Authenticode, optional)
        # Signs + verifies dist\RESTEasy-Marketo.exe (SHA-256 + RFC 3161 timestamp).
        # Only active when these repo secrets are set (see README, "Code signing"):
        #   WINDOWS_SIGNING_CERT_BASE64    base64 of the code-signing .pfx
        #   WINDOWS_SIGNING_CERT_PASSWORD  the .pfx password
        # Without them the exe ships UNSIGNED and SmartScreen warns users.
        # (GitHub does not allow `secrets` inside a step `if:`, so the presence
        #  of the certificate is checked from the environment variable below.)
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:CERT_B64) {
            Write-Warning "No Windows signing certificate configured - the exe ships UNSIGNED and Windows SmartScreen will warn users. Add WINDOWS_SIGNING_CERT_BASE64 + WINDOWS_SIGNING_CERT_PASSWORD to repo secrets (see README, 'Code signing')."
            exit 0
          }
          $exe = "dist\RESTEasy-Marketo.exe"
          if (-not (Test-Path $exe)) { throw "dist\RESTEasy-Marketo.exe not found" }
          $ts = if ($env:SIGN_TIMESTAMP_URL) { $env:SIGN_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          $pfx = Join-Path $env:RUNNER_TEMP "resteasy-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          try {
            if ($env:CERT_PASSWORD) {
              $pw = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
              Sign-Authenticode -CertFilePath $pfx -CertPassword $pw -TimestampServer $ts -Force $exe
            } else {
              Sign-Authenticode -CertFilePath $pfx -TimestampServer $ts -Force $exe
            }
            $sig = Get-AuthenticodeSignature $exe
            if ($sig.Status -ne "Valid") { throw "Signature not valid: $($sig.Status) - $($sig.StatusMessage)" }
            Write-Host ("Signed by: {0}" -f $sig.SignerCertificate.Subject)
          } finally {
            Remove-Item $pfx -Force
          }
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/RESTEasy-Marketo.exe -DestinationPath RESTEasy-Marketo-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RESTEasy-Marketo-windows-x64
          path: RESTEasy-Marketo-windows-x64.zip

  build-macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest     # arm64 runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller RESTEasy-Marketo.spec --noconfirm
      - name: Show dist/ contents
        run: ls -la dist/
      - name: Code sign + notarize (Developer ID if configured, else ad-hoc)
        # Signs dist/RESTEasy-Marketo.app. Behavior depends on repo secrets (README, "Code signing"):
        #   MACOS_CODESIGN_P12_BASE64     base64 of the Developer ID .p12  -> Developer ID signature
        #   MACOS_CODESIGN_P12_PASSWORD   the .p12 password
        #   APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID                     -> Apple notarization
        # With no certificate configured it falls back to ad-hoc signing (Gatekeeper warns users).
        # (GitHub does not allow `secrets` inside a step `if:`, so presence is
        #  checked from the environment variables inside this script.)
        env:
          P12_B64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          APP="dist/RESTEasy-Marketo.app"
          if [ ! -d "$APP" ]; then
            echo "Expected 'dist/RESTEasy-Marketo.app' - actual contents of dist/:" >&2
            ls -laR dist/ >&2
            exit 1
          fi
          IDENTITY=""
          if [ -n "$P12_B64" ]; then
            # Import the Developer ID certificate into a temporary keychain
            # (same `security` sequence apple-actions/import-codesign-certs uses).
            KEYCHAIN="$RUNNER_TEMP/resteasy-signing.keychain"
            KEYCHAIN_PW="resteasy-runner"
            P12="$RUNNER_TEMP/resteasy.p12"
            printf '%s' "$P12_B64" | base64 -d > "$P12"
            security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
            security import "$P12" -P "${P12_PASSWORD:-}" -A -t cert -f pkcs12 \
              -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/pkgbuild \
              -T /usr/bin/productbuild -T /usr/bin/productsign -k "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
            security list-keychains -s "$KEYCHAIN"
            security set-keychain-settings
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"
            rm -f "$P12"
            IDENTITY=$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/ { print $2; exit }')
            [ -n "$IDENTITY" ] || { echo "Certificate imported but no valid codesigning identity found" >&2; exit 1; }
            echo "Developer ID identity: $IDENTITY"
          else
            echo "WARNING: no Developer ID certificate configured - ad-hoc signing only."
            echo "         Gatekeeper will warn users. Add MACOS_CODESIGN_P12_BASE64 +"
            echo "         MACOS_CODESIGN_P12_PASSWORD to repo secrets (README, 'Code signing')."
          fi
          if [ -n "$IDENTITY" ]; then
            # --force: re-sign the ad-hoc build signature; --deep: nested frameworks;
            # --options runtime: hardened runtime (required for notarization);
            # --timestamp: signature stays valid after the certificate expires
            codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP"
          else
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | sed -n '1,8p'
          # Notarize (optional but strongly recommended; without it, Gatekeeper
          # still warns on macOS 10.15+ even with a Developer ID signature).
          if [ -n "$IDENTITY" ] && [ -n "$APPLE_ID" ]; then
            echo "Notarizing (Apple notary service)..."
            TMP_ZIP="$RUNNER_TEMP/resteasy-notary.zip"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "$TMP_ZIP"
            xcrun notarytool submit "$TMP_ZIP" --apple-id "$APPLE_ID" \
              --password "${APPLE_APP_PASSWORD:-}" --team-id "${APPLE_TEAM_ID:-}" --wait
            xcrun stapler staple "$APP"
            rm -f "$TMP_ZIP"
          elif [ -n "$IDENTITY" ]; then
            echo "NOTE: signed with Developer ID, but APPLE_ID / APPLE_APP_PASSWORD / APPLE_TEAM_ID"
            echo "      are not set - skipping notarization (Gatekeeper will still warn)."
          fi
      - name: Package (zip)
        run: ditto -c -k --sequesterRsrc --keepParent "dist/RESTEasy-Marketo.app" RESTEasy-Marketo-macos-arm64.zip
      - name: Verify final zip contents are signed
        run: |
          codesign --verify --deep --strict "dist/RESTEasy-Marketo.app"
      - uses: actions/upload-artifact@v4
        with:
          name: RESTEasy-Marketo-macos-arm64
          path: RESTEasy-Marketo-macos-arm64.zip

  release:
    name: Publish release
    needs: [build-windows, build-macos]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Show artifacts (verify both zips are present)
        run: ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            RESTEasy-Marketo-windows-x64.zip
            RESTEasy-Marketo-macos-arm64.zip
